spring:

  application:
    name: onboardguard-backend

  # DATABASE CONNECTION (PostgreSQL)
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # JPA / HIBERNATE CONFIGURATION
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Lettuce pool settings (optional, for better performance)
      lettuce:
        pool:
          max-active: 10               # max simultaneous Redis connections
          max-idle: 5
          min-idle: 2
          max-wait: 2000ms             # wait up to 2s before throwing pool exhausted error

# Async Configuration
async:
  core-pool-size: ${ASYNC_CORE_POOL_SIZE:5}
  max-pool-size: ${ASYNC_MAX_POOL_SIZE:20}
  queue-capacity: ${ASYNC_QUEUE_CAPACITY:100}
  thread-name-prefix: ${ASYNC_THREAD_NAME_PREFIX:onboardguard-async-}