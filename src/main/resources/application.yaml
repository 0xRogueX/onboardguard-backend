spring:

  application:
    name: onboardguard-backend

  # DATABASE CONNECTION (PostgreSQL)
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # JPA / HIBERNATE CONFIGURATION
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      # Lettuce pool settings (optional, for better performance)
      lettuce:
        pool:
          max-active: 10               # max simultaneous Redis connections
          max-idle: 5
          min-idle: 2
          max-wait: 2000ms             # wait up to 2s before throwing pool exhausted error